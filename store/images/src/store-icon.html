<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store icon 128x128</title>
<!-- Store icon: 96x96 artwork centred on a transparent 128x128 canvas, as the Chrome Web Store asks. -->
<style>
  html, body { margin: 0; width: 128px; height: 128px; background: transparent; }
  body { display: grid; place-items: center; }
  img { width: 96px; height: 96px; display: block; }
</style>
</head>
<body><img src="../../../public/app-icon.png" alt=""></body>
</html>
