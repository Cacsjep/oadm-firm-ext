# Security updates only: version updates are switched off (open-pull-requests-limit: 0), so Dependabot opens pull
# requests only for dependencies with a security advisory (needs "Dependabot security updates" on in the repo
# settings). They are grouped into one pull request per ecosystem. Every pull request is built by pr.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
